server {
    listen 80;
    listen [::]:80;
    server_name staging.tuphim.online;
    access_log /var/log/nginx/vua-beach-staging.access.log vua_beach_no_query;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://staging.tuphim.online$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.tuphim.online;
    access_log /var/log/nginx/vua-beach-staging.access.log vua_beach_no_query;

    root /var/www/vua-beach-staging/public;
    index index.php;
    charset utf-8;
    client_max_body_size 16m;

    ssl_certificate /etc/letsencrypt/live/staging.tuphim.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.tuphim.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_basic "Vua Beach staging";
    auth_basic_user_file /etc/nginx/.vua-beach-staging.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json application/xml image/svg+xml text/css text/plain text/xml;

    location /build/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location ~* ^/(?:images|fonts)/.+\.(?:avif|gif|ico|jpe?g|png|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Provider callbacks authenticate in Laravel using signatures/shared secrets.
    # Dispatch directly to index.php so internal redirects do not restore Basic Auth.
    location = /thanh-toan/momo/ipn {
        auth_basic off;
        client_max_body_size 64k;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location = /thanh-toan/vnpay/ipn {
        auth_basic off;
        client_max_body_size 64k;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location = /van-chuyen/ghn/webhook {
        auth_basic off;
        client_max_body_size 64k;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location = /index.php {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

# Install in /etc/nginx/conf.d/. Preserve the original path before Laravel's
# internal /index.php rewrite, while deliberately omitting query strings and
# Referer: callbacks and webhooks may contain signatures or tokens.
map $request $vua_beach_log_path {
    ~^[A-Z]+\s+/dat-lai-mat-khau/[^/?\s]+ /dat-lai-mat-khau/[REDACTED];
    ~^[A-Z]+\s+/xac-thuc-email/[^/?\s]+/[^/?\s]+ /xac-thuc-email/[REDACTED]/[REDACTED];
    ~^[A-Z]+\s+(?<vua_beach_original_path>[^?\s]+) $vua_beach_original_path;
    default /;
}

log_format vua_beach_no_query '$remote_addr [$time_local] '
                               '"$request_method $vua_beach_log_path $server_protocol" '
                               '$status $body_bytes_sent $request_time '
                               '"$http_user_agent"';
